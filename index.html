<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineFacil</title>

  <style>
    body {
      margin: 0;
      background: #09090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px;
      background: #15151c;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .logo span {
      color: #e50914;
    }

    .subtitulo {
      color: #aaa;
      margin-top: 8px;
    }

    main {
      padding: 25px 18px;
      max-width: 800px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 15px;
      box-sizing: border-box;
      background: #1b1b23;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #e50914;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    #resultado {
      margin-top: 25px;
    }

    .filme {
      background: #17171e;
      border: 1px solid #292933;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .filme h2 {
      margin-top: 0;
    }

    .nota {
      color: #ffd000;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Cine<span>Facil</span></div>
  <div class="subtitulo">
    Descubra filmes, informações e trailers
  </div>
</header>

<main>

  <h1>🔎 Pesquisar filmes</h1>

  <input
    id="pesquisa"
    type="text"
    placeholder="Digite o nome de um filme..."
  >

  <button onclick="buscar()">
    Buscar
  </button>

  <div id="resultado">

    <div class="filme">
      <h2>🎬 O Grande Filme</h2>
      <p>2026 • Ação</p>
      <p class="nota">⭐ 8.5</p>
    </div>

    <div class="filme">
      <h2>🍿 Aventura Incrível</h2>
      <p>2026 • Aventura</p>
      <p class="nota">⭐ 8.1</p>
    </div>

    <div class="filme">
      <h2>🚀 Além do Espaço</h2>
      <p>2025 • Ficção</p>
      <p class="nota">⭐ 9.0</p>
    </div>

  </div>

</main>

<script>
function buscar() {

  const texto = document
    .getElementById("pesquisa")
    .value
    .toLowerCase();

  const filmes = document.querySelectorAll(".filme");

  filmes.forEach(function(filme) {

    const nome = filme
      .querySelector("h2")
      .textContent
      .toLowerCase();

    if (nome.includes(texto)) {
      filme.style.display = "block";
    } else {
      filme.style.display = "none";
    }

  });
}
</script>

</body>
</html>
