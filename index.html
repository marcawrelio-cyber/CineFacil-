<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CineFácil</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px 18px;
      background: #15151c;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .logo span {
      color: #e50914;
    }

    .subtitulo {
      color: #aaa;
      margin-top: 8px;
    }

    main {
      padding: 25px 18px;
      max-width: 900px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 15px;
      background: #1b1b23;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #e50914;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado {
      margin-top: 25px;
    }

    .filme {
      background: #17171e;
      border: 1px solid #292933;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .filme:hover {
      transform: scale(1.01);
      border-color: #e50914;
    }

    .filme img {
      width: 100px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .filme h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .nota {
      color: #ffd000;
      font-weight: bold;
    }

    .carregando,
    .erro {
      text-align: center;
      color: #aaa;
    }

    .detalhes {
      display: none;
      background: #15151c;
      border-radius: 16px;
      padding: 20px;
    }

    .detalhes-topo {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .poster-grande {
      width: 220px;
      max-width: 40%;
      height: auto;
      object-fit: cover;
      border-radius: 12px;
    }

    .detalhes h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .generos {
      color: #ccc;
      margin: 10px 0;
    }

    .sinopse {
      line-height: 1.6;
      color: #ddd;
    }

    .voltar {
      background: #33333d;
      margin-bottom: 20px;
    }

    .trailer {
      margin-top: 25px;
    }

    .trailer iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .detalhes-topo {
        flex-direction: column;
      }

      .poster-grande {
        max-width: 220px;
        width: 100%;
        margin: auto;
      }

      .detalhes h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Cine<span>Fácil</span></div>

  <div class="subtitulo">
    Descubra filmes, informações e trailers
  </div>
</header>

<main>

  <section id="telaPesquisa">

    <h1>🔎 Pesquisar filmes</h1>

    <input
      id="pesquisa"
      type="text"
      placeholder="Digite o nome de um filme..."
      onkeydown="if(event.key === 'Enter') buscar()"
    >

    <button onclick="buscar()">
      Buscar
    </button>

    <div id="resultado"></div>

  </section>


  <section id="telaDetalhes" class="detalhes">

    <button class="voltar" onclick="voltarPesquisa()">
      ← Voltar para pesquisa
    </button>

    <div id="conteudoDetalhes"></div>

  </section>

</main>


<script>

const API_KEY = "f4e2430e564ffb2d4128ed961cd4a78d";

const URL_BASE = "https://api.themoviedb.org/3";

const IMAGENS = "https://image.tmdb.org/t/p/w500";


async function buscar() {

  const texto = document
    .getElementById("pesquisa")
    .value
    .trim();

  const resultado = document.getElementById("resultado");

  if (!texto) {
    resultado.innerHTML =
      "<p class='erro'>Digite o nome de um filme.</p>";
    return;
  }

  resultado.innerHTML =
    "<p class='carregando'>🔎 Pesquisando filmes...</p>";

  try {

    const url =
      URL_BASE +
      "/search/movie" +
      "?api_key=" + API_KEY +
      "&language=pt-BR" +
      "&query=" + encodeURIComponent(texto);

    const resposta = await fetch(url);

    if (!resposta.ok) {
      throw new Error("Erro na API");
    }

    const dados = await resposta.json();

    if (!dados.results || dados.results.length === 0) {

      resultado.innerHTML =
        "<p class='erro'>Nenhum filme encontrado.</p>";

      return;
    }

    resultado.innerHTML = "";

    dados.results.forEach(function(filme) {

      const ano = filme.release_date
        ? filme.release_date.substring(0, 4)
        : "Ano desconhecido";

      const nota = filme.vote_average
        ? filme.vote_average.toFixed(1)
        : "Sem nota";

      const poster = filme.poster_path
        ? IMAGENS + filme.poster_path
        : "";

      const elemento = document.createElement("div");

      elemento.className = "filme";

      elemento.innerHTML = `

        ${
          poster
          ? `<img src="${poster}" alt="${filme.title}">`
          : ""
        }

        <div>

          <h2>🎬 ${filme.title}</h2>

          <p>📅 ${ano}</p>

          <p class="nota">
            ⭐ ${nota}
          </p>

          <p>
            ${filme.overview || "Sinopse não disponível."}
          </p>

        </div>

      `;

      elemento.onclick = function() {
        abrirDetalhes(filme.id);
      };

      resultado.appendChild(elemento);

    });

  } catch (erro) {

    console.error(erro);

    resultado.innerHTML =
      "<p class='erro'>Não foi possível pesquisar os filmes.</p>";

  }

}


async function abrirDetalhes(id) {

  const telaPesquisa =
    document.getElementById("telaPesquisa");

  const telaDetalhes =
    document.getElementById("telaDetalhes");

  const conteudo =
    document.getElementById("conteudoDetalhes");

  telaPesquisa.style.display = "none";

  telaDetalhes.style.display = "block";

  conteudo.innerHTML =
    "<p class='carregando'>🎬 Carregando informações...</p>";

  try {

    const url =
      URL_BASE +
      "/movie/" +
      id +
      "?api_key=" +
      API_KEY +
      "&language=pt-BR";

    const resposta =
      await fetch(url);

    if (!resposta.ok) {
      throw new Error("Erro ao carregar filme");
    }

    const filme =
      await resposta.json();

    const poster =
      filme.poster_path
      ? IMAGENS + filme.poster_path
      : "";

    const ano =
      filme.release_date
      ? filme.release_date.substring(0, 4)
      : "Ano desconhecido";

    const nota =
      filme.vote_average
      ? filme.vote_average.toFixed(1)
      : "Sem nota";

    const generos =
      filme.genres && filme.genres.length
      ? filme.genres.map(g => g.name).join(" • ")
      : "Não informado";

    conteudo.innerHTML = `

      <div class="detalhes-topo">

        ${
          poster
          ? `<img
              class="poster-grande"
              src="${poster}"
              alt="${filme.title}"
            >`
          : ""
        }

        <div>

          <h1>${filme.title}</h1>

          <p>📅 ${ano}</p>

          <p class="nota">
            ⭐ ${nota}
          </p>

          <p class="generos">
            🎭 ${generos}
          </p>

        </div>

      </div>

      <h2>📖 Sinopse</h2>

      <p class="sinopse">
        ${
          filme.overview ||
          "Sinopse não disponível."
        }
      </p>

      <div id="areaTrailer"></div>

    `;

    buscarTrailer(id);

  } catch (erro) {

    console.error(erro);

    conteudo.innerHTML =
      "<p class='erro'>Não foi possível carregar os detalhes.</p>";

  }

}


async function buscarTrailer(id) {

  const area =
    document.getElementById("areaTrailer");

  try {

    const url =
      URL_BASE +
      "/movie/" +
      id +
      "/videos" +
      "?api_key=" +
      API_KEY +
      "&language=pt-BR";

    const resposta =
      await fetch(url);

    const dados =
      await resposta.json();

    let trailer =
      dados.results.find(video =>
        video.site === "YouTube" &&
        video.type === "Trailer"
      );

    if (!trailer) {

      trailer =
        dados.results.find(video =>
          video.site === "YouTube"
        );

    }

    if (trailer) {

      area.innerHTML = `

        <div class="trailer">

          <h2>▶️ Trailer</h2>

          <iframe
            src="https://www.youtube.com/embed/${trailer.key}"
            allowfullscreen>
          </iframe>

        </div>

      `;

    } else {

      area.innerHTML = `
        <p class="generos">
          🎞️ Trailer não disponível.
        </p>
      `;

    }

  } catch (erro) {

    console.error(erro);

  }

}


function voltarPesquisa() {

  document.getElementById("telaDetalhes")
    .style.display = "none";

  document.getElementById("telaPesquisa")
    .style.display = "block";

}

</script>

</body>
</html>
