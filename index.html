<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CineFacil</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #09090d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111118;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 1px solid #272733;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .logo span {
      color: #e50914;
    }

    .subtitulo {
      color: #999;
      margin-top: 7px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px;
    }

    .titulo {
      font-size: 24px;
      margin-bottom: 18px;
    }

    .busca {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .busca input {
      flex: 1;
      min-width: 0;
      background: #18181f;
      color: white;
      border: 1px solid #33333e;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    .busca input:focus {
      border-color: #e50914;
    }

    .busca button {
      background: #e50914;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: bold;
    }

    .categorias {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 30px;
    }

    .categoria {
      background: #18181f;
      border: 1px solid #292933;
      border-radius: 20px;
      padding: 10px 16px;
      white-space: nowrap;
      color: #ddd;
    }

    .filmes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .filme {
      background: #15151c;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #292933;
    }

    .poster {
      width: 100%;
      height: 230px;
      background: #252530;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    .info {
      padding: 14px;
    }

    .info h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .info p {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .nota {
      color: #ffd000;
      font-size: 14px;
    }

    .mensagem {
      color: #999;
      text-align: center;
      margin: 25px 0;
    }

    .rodape {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 13px;
    }

    @media (min-width: 600px) {
      .filmes {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Cine<span>Facil</span></div>

  <div class="subtitulo">
    Descubra filmes, informações e trailers
  </div>
</header>

<main class="container">

  <h1 class="titulo">🔎 Pesquisar filmes</h1>

  <div class="busca">
    <input
      type="text"
      id="pesquisa"
      placeholder="Digite o nome de um filme..."
    >

    <button onclick="buscarFilme()">
      Buscar
    </
