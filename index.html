<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CineFácil</title>

  <style>
    body {
      margin: 0;
      background: #09090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px;
      background: #15151c;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .logo span {
      color: #e50914;
    }

    .subtitulo {
      color: #aaa;
      margin-top: 8px;
    }

    main {
      padding: 25px 18px;
      max-width: 800px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 15px;
      box-sizing: border-box;
      background: #1b1b23;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #e50914;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado {
      margin-top: 25px;
    }

    .filme {
      background: #17171e;
      border: 1px solid #292933;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
    }

    .filme img {
      width: 100px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .filme h2 {
      margin-top: 0;
    }

    .nota {
      color: #ffd000;
    }

    .carregando {
      text-align: center;
      color: #aaa;
    }

    .erro {
      text-align: center;
      color: #ff6b6b;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Cine<span>Fácil</span></div>

  <div class="subtitulo">
    Descubra filmes, informações e trailers
  </div>
</header>

<main>

  <h1>🔎 Pesquisar filmes</h1>

  <input
    id="pesquisa"
    type="text"
    placeholder="Digite o nome de um filme..."
    onkeydown="if(event.key === 'Enter') buscar()"
  >

  <button onclick="buscar()">
    Buscar
  </button>

  <div id="resultado"></div>

</main>

<script>

const API_KEY = "f4e2430e564ffb2d4128ed961cd4a78d";

async function buscar() {

  const texto = document
    .getElementById("pesquisa")
    .value
    .trim();

  const resultado = document.getElementById("resultado");

  if (!texto) {
    resultado.innerHTML =
      "<p class='erro'>Digite o nome de um filme.</p>";
    return;
  }

  resultado.innerHTML =
    "<p class='carregando'>🔎 Pesquisando filmes...</p>";

  try {

    const url =
      "https://api.themoviedb.org/3/search/movie" +
      "?api_key=" + API_KEY +
      "&language=pt-BR" +
      "&query=" + encodeURIComponent(texto);

    const resposta = await fetch(url);

    if (!resposta.ok) {
      throw new Error("Erro na API");
    }

    const dados = await resposta.json();

    if (!dados.results || dados.results.length === 0) {
      resultado.innerHTML =
        "<p class='erro'>Nenhum filme encontrado.</p>";
      return;
    }

    resultado.innerHTML = "";

    dados.results.forEach(function(filme) {

      const ano = filme.release_date
        ? filme.release_date.substring(0, 4)
        : "Ano desconhecido";

      const nota = filme.vote_average
        ? filme.vote_average.toFixed(1)
        : "Sem nota";

      const poster = filme.poster_path
        ? "https://image.tmdb.org/t/p/w300" + filme.poster_path
        : "";

      const descricao = filme.overview
        ? filme.overview
        : "Sinopse não disponível.";

      const elemento = document.createElement("div");

      elemento.className = "filme";

      elemento.innerHTML = `
        ${poster
          ? `<img src="${poster}" alt="${filme.title}">`
          : ""
        }

        <div>
          <h2>🎬 ${filme.title}</h2>

          <p>${ano}</p>

          <p class="nota">
            ⭐ ${nota}
          </p>

          <p>
            ${descricao}
          </p>
        </div>
      `;

      resultado.appendChild(elemento);

    });

  } catch (erro) {

    console.error(erro);

    resultado.innerHTML =
      "<p class='erro'>Não foi possível pesquisar os filmes. Verifique a API.</p>";

  }

}

</script>

</body>
</html>
